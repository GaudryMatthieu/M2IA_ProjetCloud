apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: helpdesk-ci
resources:
  - ../../base
images:
  - {name: helpdesk-backend, newName: helpdesk-backend, newTag: ci}
  - {name: helpdesk-worker, newName: helpdesk-worker, newTag: ci}
  - {name: helpdesk-frontend, newName: helpdesk-frontend, newTag: ci}
patches:
  - target: {kind: Ingress, name: helpdesk}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: ci.helpdesk.localtest.me}
      - {op: replace, path: /spec/tls/0/hosts/0, value: ci.helpdesk.localtest.me}
  - target: {kind: Deployment, name: backend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 1}
  - target: {kind: HorizontalPodAutoscaler, name: backend}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 1}
      - {op: replace, path: /spec/maxReplicas, value: 3}
