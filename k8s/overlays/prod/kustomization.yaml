apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: helpdesk-prod
resources:
  - ../../base
images:
  - {name: helpdesk-backend, newName: localhost:5001/helpdesk-backend, newTag: TAG_PLACEHOLDER}
  - {name: helpdesk-worker, newName: localhost:5001/helpdesk-worker, newTag: TAG_PLACEHOLDER}
  - {name: helpdesk-frontend, newName: localhost:5001/helpdesk-frontend, newTag: TAG_PLACEHOLDER}
patches:
  - target: {kind: Ingress, name: helpdesk}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: prod.helpdesk.localtest.me}
      - {op: replace, path: /spec/tls/0/hosts/0, value: prod.helpdesk.localtest.me}
  - target: {kind: Deployment, name: backend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
  - target: {kind: HorizontalPodAutoscaler, name: backend}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 2}
      - {op: replace, path: /spec/maxReplicas, value: 6}
