# Moindre privilège : les pods applicatifs n'ont AUCUN accès à l'API Kubernetes (token non monté).
apiVersion: v1
kind: ServiceAccount
metadata: {name: backend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: worker}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: frontend}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: data}
automountServiceAccountToken: false
---
# Compte utilisé par le CI/CD : peut seulement mettre à jour les Deployments de CE namespace.
apiVersion: v1
kind: ServiceAccount
metadata: {name: deployer}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deployer}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: deployer}
subjects:
  - {kind: ServiceAccount, name: deployer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}
