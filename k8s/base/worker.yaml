apiVersion: v1
kind: Service
metadata: {name: worker, labels: {app: worker}}
spec:
  selector: {app: worker}
  ports: [{name: metrics, port: 9100, targetPort: 9100}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, labels: {app: worker}}
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: helpdesk-worker
          imagePullPolicy: IfNotPresent
          ports: [{name: metrics, containerPort: 9100}]
          envFrom: [{configMapRef: {name: helpdesk-config}}]
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: POSTGRES_PASSWORD}}}
            - {name: RABBITMQ_PASSWORD, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: RABBITMQ_PASSWORD}}}
            - {name: S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: S3_ACCESS_KEY}}}
            - {name: S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: S3_SECRET_KEY}}}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
