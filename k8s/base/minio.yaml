# Stockage objet compatible S3 (pièces jointes, exports, sauvegardes).
# En production cloud : remplacer par un bucket S3/Blob en changeant S3_ENDPOINT / clés dans config + secret.
apiVersion: v1
kind: Service
metadata: {name: minio, labels: {app: minio}}
spec:
  selector: {app: minio}
  ports:
    - {name: s3, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: minio, labels: {app: minio}}
spec:
  serviceName: minio
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      serviceAccountName: data
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports: [{name: s3, containerPort: 9000}, {name: console, containerPort: 9001}]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: S3_ACCESS_KEY}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: S3_SECRET_KEY}}}
            - {name: MINIO_KMS_SECRET_KEY, valueFrom: {secretKeyRef: {name: helpdesk-secrets, key: MINIO_KMS_SECRET_KEY}}}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: 9000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
